<html>
    <head>
        <title>Санал асуулга</title>
        <link rel="stylesheet" href="style.css">
      
    </head>
    <body> 
    <h1>Оюутны хоолны газрын санал асуулга </h1>
    <form action="submit.php" method="post">
        <label for="name">Нэр:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">И-мэйл:</label>
        <input type="email" id="email" name="email" required><br><br>

        <fieldset>
      <legend>Хэр олон удаа хооллодог вэ?</legend>
      <p>
        <input type="radio" id="f-daily" name="frequency" value="daily">
        <label for="f-daily">Өдөр бүр</label>
      </p>
      <p>
        <input type="radio" id="f-often" name="frequency" value="often">
        <label for="f-often">7 хоногт 3–4 удаа</label>
      </p>
      <p>
        <input type="radio" id="f-rare" name="frequency" value="rare">
        <label for="f-rare">7 хоногт 1–2 удаа</label>
      </p>
      <p>
        <input type="radio" id="f-never" name="frequency" value="never">
        <label for="f-never">Бараг хооллодоггүй</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Ямар хоолонд дуртай вэ?</legend>
      <p>
        <input type="checkbox" id="food-buuz" name="food" value="buuz">
        <label for="food-buuz">Бууз</label>
      </p>
      <p>
        <input type="checkbox" id="food-tsuivan" name="food" value="tsuivan">
        <label for="food-tsuivan">Цуйван</label>
      </p>
      <p>
        <input type="checkbox" id="food-salad" name="food" value="salad">
        <label for="food-salad">Салат</label>
      </p>
      <p>
        <input type="checkbox" id="food-soup" name="food" value="soup">
        <label for="food-soup">Шөл</label>
      </p>
    </fieldset> <br><br>



        <label for="rating">Курс</label>
        <select id="rating" name="rating" required>
            <option value="">Сонгох</option>
            <option value="1"> 1-р курс</option>
            <option value="2"> 2-р курс </option>
            <option value="3"> 3-р курс </option>
            <option value="4"> 4-р курс </option>
        </select><br><br>

        <label for="comments">Сэтгэгдэл:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50"></textarea><br><br>
    <p>
      <label for="rating">Сэтгэл ханамж (1–10)</label>
      <input type="range" id="rating" name="rating" min="1" max="10" value="5">
    </p>

        <input type="submit" value="Илгээх">
        <input type="submit" value="Цэвэрлэх" onclick="document.getElementById('myForm').reset(); return false;">
   

    </body> 
</html>
